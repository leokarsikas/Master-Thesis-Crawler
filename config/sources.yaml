# Where to look for thesis listings.
#
# type:
#   generic_html     any career page: follows thesis-looking links (works for most sites)
#   teamtailor       Teamtailor career sites (<company>.teamtailor.com/jobs or a custom domain)
#   smartrecruiters  companies on SmartRecruiters, via its public API (needs company_id)
#   kth_portal       KTH Degree Project Portal table (can start on an info page that links to it)
#   jobtech          Platsbanken via the JobTech JobSearch API
#
# Sources that fail are listed at the bottom of the report; fix the URL
# (point it at the company's careers / students / thesis page) or set enabled: false.
# Optional per-source keys: company, link_pattern, max_depth, max_pages, enabled.
# Companies whose own sites can't be crawled still show up through Platsbanken,
# which has a query per company below.

sources:
  # --- Job boards ------------------------------------------------------------
  - name: Platsbanken
    type: jobtech
    url: https://jobsearch.api.jobtechdev.se/search
    queries: [examensarbete, exjobb, master thesis, thesis worker, examensarbete hälsa,
              examensarbete medicin, thesis AstraZeneca, thesis Elekta, thesis RaySearch,
              thesis AFRY, thesis Doctrin, thesis Knightec, thesis Atea, examensarbete Karolinska]

  - name: dittexjobb.se
    type: generic_html
    url: https://www.dittexjobb.se/hitta-examensarbete-exjobb
    max_depth: 2
    max_pages: 80

  # --- KTH -------------------------------------------------------------------
  - name: KTH Degree Project Portal
    type: kth_portal
    company: KTH
    url: https://www.kth.se/en/samverkan/exjobb/studenter

  - name: KTH MoveAbility Lab
    company: KTH MoveAbility Lab
    url: https://www.kth.se/moveabilitylab

  # --- My own picks ----------------------------------------------------------
  - name: RaySearch Laboratories
    url: https://raysearchlabs.workbuster.com/
  - name: AstraZeneca
    url: https://www.astrazeneca.com/content/az-se/karriar/early-talent-careers.html
  - name: AstraZeneca careers
    company: AstraZeneca
    url: https://careers.astrazeneca.com/students
  - name: Saluto
    url: https://www.saluto.se/

  # --- Companies from the Data-driven Health thesis guidelines ---------------
  - name: Acorai
    url: https://www.acorai.com/
  - name: AFRY
    type: smartrecruiters
    company_id: AFRY
